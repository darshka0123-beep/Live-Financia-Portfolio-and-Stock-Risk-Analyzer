<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Financial Portfolio & Stock Risk Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.50.0/build/stlite.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.50.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      stlite.mount(
        {
          requirements: [
            "numpy",
            "pandas",
            "matplotlib",
            "seaborn",
            "plotly",
            "scipy"
          ],
          entrypoint: "app_web.py",
          files: {
            "app_web.py": {
              url: "./app_web.py"
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
