<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Live Financial Portfolio & Stock Risk Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.js"></script>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.js";

      mount(
        {
          requirements: [
            "streamlit",
            "pandas",
            "numpy",
            "matplotlib",
            "seaborn",
            "nltk",
            "plotly",
            "scipy",
            "requests"
          ],
          entrypoint: "app_web.py",
          files: {
            "app_web.py": {
              url: "./app_web.py"
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
